
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Carrito - Latido & Estilo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../estilos/estilo.css">
</head>
<body class="cart-page bg-light text-dark">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="img/logo.png" alt="Logo Latido & Estilo" width="60" height="60" class="me-2">
        <span class="brand-text">LATIDO <span class="amp">&</span> ESTILO</span>
      </a>

      <div>
        <a href="/cart.html" class="btn btn-outline-primary fw-semibold">
          Mi Carrito <span id="cart-count" class="badge bg-primary text-light ms-1">0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="container py-5">
    <h1 class="mb-4 fw-semibold text-primary">Carrito</h1>

    <div class="cart-container">
      <table class="table table-borderless align-middle">
        <thead>
          <tr class="text-muted">
            <th>Producto</th>
            <th class="text-center">Cantidad</th>
            <th class="text-center">Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cart-body">
          <!-- Ejemplo de fila -->
          <tr>
            <td class="product-name">Zapato Azul</td>
            <td class="quantity text-center">2</td>
            <td class="subtotal text-center">$120.000</td>
            <td class="text-center">
              <button class="btn btn-outline-danger btn-sm">Eliminar</button>
            </td>
          </tr>
          <tr>
            <td class="product-name">Tenis Blanco</td>
            <td class="quantity text-center">1</td>
            <td class="subtotal text-center">$80.000</td>
            <td class="text-center">
              <button class="btn btn-outline-danger btn-sm">Eliminar</button>
            </td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2" class="text-end fw-semibold">Total</td>
            <td class="total text-center" id="cart-total">$200.000</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>




    <div class="d-flex gap-2 mt-4">
      <button id="btn-clear" class="btn btn-outline-danger">Vaciar carrito</button>
      <a href="/" class="btn btn-primary">Seguir comprando</a>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer-custom py-4">
    <div class="container text-center text-muted small">
      &copy; <span id="year"></span> Latido & Estilo · Todos los derechos reservados
    </div>
  </footer>

  <script src="js/cart.js" type="module"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
