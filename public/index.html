<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Latido & Estilo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../estilos/estilo.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

</head>
<body class="bg-light text-dark">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="img/logo.png" alt="Logo Latido & Estilo" width="60" height="60" class="me-2">
        <span class="brand-text">LATIDO <span class="amp">&</span> ESTILO</span>
      </a>

      <div>
        <a href="/cart.html" class="btn btn-outline-primary fw-semibold">
          Carrito <span id="cart-count" class="badge bg-primary text-light ms-1">0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="py-5 text-center">
    <div class="container">
      <h1 class="display-6 fw-semibold text-primary">Camina al ritmo de tu historia.</h1>
      <p class="lead text-muted mt-3">“Tu paso, tu latido, tu estilo.”</p>

      <!-- VIDEO DE PRESENTACIÓN -->
      <div class="ratio ratio-16x9 mt-4">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/0GQ42u_YI3o?autoplay=1&mute=1&loop=1&playlist=0GQ42u_YI3o&controls=1"
          title="LATIDO & ESTILO"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

      </div>
    </div>
  </header>

  <!-- FILTRO DE PRODUCTOS -->
   <!--<div class="col-12 col-sm-6 "></div>-->
<div class="container py-3 bg-light filtro-busqueda rounded-3">
  <h3>Búsqueda Avanzada de tu Producto:</h3>
  <div class="row g-2 align-items-center">
    <div class="col-md-4">
      <input id="search-name" type="text" class="form-control" placeholder="Buscar por nombre...">
    </div>
    <div class="col-md-3">
      <input id="min-price" type="number" class="form-control" placeholder="Precio mínimo">
    </div>
    <div class="col-md-3">
      <input id="max-price" type="number" class="form-control" placeholder="Precio máximo">
    </div>
    <div class="col-md-2 d-grid">
      <button id="filter-btn" class="btn btn-primary">Filtrar</button>
    </div>
  </div>
</div>

  <!-- PRODUCTOS -->
  <main class="container py-5">
    <div id="product-list" class="row g-4"></div>
  </main>

  <!-- FOOTER -->
  <footer class="footer-custom py-4">
    <div class="container text-center text-muted small">
      &copy; <span id="year"></span> Latido & Estilo · Todos los derechos reservados
    </div>
  </footer>

  <!-- ✅ TOAST de Bootstrap -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="cartToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          🛒 Producto agregado al carrito
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>

  <script src="js/app.js" type="module"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // ✅ Función para mostrar el Toast (llámala después de agregar producto)
    function showCartToast(message = "Producto agregado al carrito") {
      const toastEl = document.getElementById("cartToast");
      const toastBody = toastEl.querySelector(".toast-body");
      toastBody.textContent = message;

      const toast = new bootstrap.Toast(toastEl, { delay: 2500 });
      toast.show();
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
