<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Zapatería Aether</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #c3cfe2, #f5f7fa);
      font-family: "Poppins", sans-serif;
    }

    .register-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: none;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      animation: fadeIn 0.6s ease-in-out;
    }

    .register-card h4 {
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #333;
    }

    .form-control {
      border-radius: 10px;
      transition: all 0.2s ease-in-out;
    }

    .form-control:focus {
      box-shadow: 0 0 0 0.2rem rgba(33, 37, 41, 0.25);
      transform: scale(1.02);
    }

    .btn-dark {
      border-radius: 10px;
      transition: background 0.3s ease;
    }

    .btn-dark:hover {
      background-color: #343a40e0;
    }

    .login-link {
      display: block;
      margin-top: 1rem;
      text-align: center;
      color: #0d6efd;
      text-decoration: none;
    }

    .login-link:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">

  <div class="register-card">
    <h4 class="text-center">Crear cuenta</h4>

    <form onsubmit="return registrarUsuario()">
      <div class="mb-3">
        <label for="usuario" class="form-label">Nombre de usuario</label>
        <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Tu usuario">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="•••••••">
      </div>

      <div class="mb-3">
        <label for="confirmar" class="form-label">Confirmar contraseña</label>
        <input type="password" class="form-control" id="confirmar" name="confirmar" placeholder="•••••••">
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-dark">Registrarme</button>
      </div>
    </form>

    <div id="mensaje-error" class="text-danger text-center mt-3" style="display: none;"></div>
    <div id="mensaje-ok" class="text-success text-center mt-3" style="display: none;"></div>

    <!-- Enlace a login -->
    <a href="login.html" class="login-link">¿Ya tienes cuenta? Inicia sesión aquí</a>
  </div>

  <script>
    async function registrarUsuario() {
      const usuario = document.getElementById("usuario").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmar = document.getElementById("confirmar").value.trim();
      const errorMsg = document.getElementById("mensaje-error");
      const okMsg = document.getElementById("mensaje-ok");

      errorMsg.style.display = "none";
      okMsg.style.display = "none";

      if (!usuario || !password || !confirmar) {
        errorMsg.innerText = "⚠️ Completa todos los campos.";
        errorMsg.style.display = "block";
        return false;
      }

      if (password !== confirmar) {
        errorMsg.innerText = "⚠️ Las contraseñas no coinciden.";
        errorMsg.style.display = "block";
        return false;
      }

      try {
        const respuesta = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, password })
        });

        const data = await respuesta.json();

        if (data.ok) {
          okMsg.innerText = "✅ Registro exitoso. Redirigiendo al login...";
          okMsg.style.display = "block";
          setTimeout(() => (window.location.href = "login.html"), 1500);
        } else {
          errorMsg.innerText = data.msg || "⚠️ Error al registrar usuario.";
          errorMsg.style.display = "block";
        }
      } catch (error) {
        console.error("Error en registro:", error);
        errorMsg.innerText = "⚠️ No se pudo conectar con el servidor.";
        errorMsg.style.display = "block";
      }

      return false;
    }
  </script>
</body>
</html>
